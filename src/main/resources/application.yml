spring:
  grpc:
    server:
      port: 9090
  application:
    name: country
  datasource:
    username: postgres
    password: secret
    url: 'jdbc:postgresql://localhost:5432/country_db'
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: country
    locations: classpath:db/migration/country
    clean-disabled: false
    clean-on-validation-error: true
  jpa:
    properties:
      hibernate:
        default_schema: country
    hibernate:
      ddl-auto: validate
    show-sql: true
    generate-ddl: false
  graphql:
    graphiql:
      enabled: true

server:
  port: 8284

logging:
  level:
    org.springframework.graphql: DEBUG
    com.example.country1: DEBUG
    org.hibernate: DEBUG
    org.springframework: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"